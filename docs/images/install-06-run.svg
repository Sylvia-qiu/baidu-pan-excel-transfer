<title id="title">导入并开始处理</title><desc id="desc">选择填写好的 .xlsx，先核对链接和目标目录。① 选择 Excel 文件 → 检查任务清单。② 勾选需要处理的任务 → 点击开始。③ 完成后点击新链接复制，或导出结果 Excel。开始处理选中项。导出：序号 | 原始链接 | 转存链接 | 转存路径 | 备注 | 附加列</desc>
