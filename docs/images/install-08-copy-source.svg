<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">在哪里复制完整源码？</title><desc id="desc">GitHub 仓库 → 脚本文件 → Raw → 全选复制。baidu-pan-excel-transfer.user.js。打开脚本文件，在代码区域上方找到 Raw。进入纯代码页面后：Ctrl+A → Ctrl+C。Raw → 纯代码页面。复制全部源码；不要复制 README、单独的 app.js 或网址</desc>
